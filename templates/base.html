<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CO-PO Attainment{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5d6675; --line:#d9dee6; --accent:#1f5fbf; --head:#e8eef8; --ok:#1d7a3e; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:14px 24px; }
  header a { color:#fff; text-decoration:none; font-weight:600; font-size:17px; }
  main { max-width:1280px; margin:0 auto; padding:20px 16px 60px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:18px; }
  h2 { font-size:16px; margin:0 0 4px; }
  p.hint { color:var(--muted); margin:0 0 12px; font-size:13px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; font-size:13px; }
  th, td { border:1px solid var(--line); padding:4px 6px; text-align:center; white-space:nowrap; }
  th { background:var(--head); font-weight:600; }
  td.l, th.l { text-align:left; }
  tr.hl td { background:#fff6db; font-weight:600; }
  tr.hl2 td { background:#e3f4e8; font-weight:600; }
  input[type=number] { width:64px; padding:3px 4px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  input[type=text] { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .pair { display:flex; gap:3px; justify-content:center; }
  .pair input { width:54px; }
  button, .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 18px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button.link { background:none; color:var(--bad); padding:0; font-weight:400; }
  .errors { background:#fdecea; border-color:#f5b5ae; color:var(--bad); }
  .errors ul { margin:6px 0 0; padding-left:20px; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:150px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}">CO-PO Attainment Calculator</a></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
